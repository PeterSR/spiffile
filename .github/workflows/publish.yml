# Publishing is tag-driven and per-language — nothing publishes until a tag
# is pushed deliberately:
#
#   python-vX.Y.Z  -> PyPI   (trusted publishing / OIDC; no long-lived token
#                             anywhere — configured on pypi.org)
#   ts-vX.Y.Z      -> npm    (trusted publishing / OIDC with provenance; no
#                             token — configured on npmjs.com, package
#                             settings -> Trusted Publisher)
#
# Go needs no publish step at all: consumers fetch modules straight from git
# via the module proxy. To release the Go library, push a subdirectory tag:
#
#   git tag go/vX.Y.Z && git push origin go/vX.Y.Z
name: publish

on:
  push:
    tags:
      - "python-v*"
      - "ts-v*"

jobs:
  pypi:
    if: startsWith(github.ref_name, 'python-v')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # PyPI trusted publishing
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
      - run: uv sync && uv run pytest -q
      - run: uv build
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: python/dist

  npm:
    if: startsWith(github.ref_name, 'ts-v')
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      id-token: write # npm trusted publishing + provenance
    defaults:
      run:
        working-directory: ts
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      # Trusted publishing needs npm >= 11.5.1; the runner image ships 10.x.
      - run: npm install -g npm@latest
      - run: npm ci
      - run: npm test
      - run: npm publish --access public
